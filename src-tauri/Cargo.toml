[package]
name = "jig"
version = "0.2.0"
description = "A GUI graph viewer for Jujutsu"
edition = "2024"
license = "MIT"

[lib]
name = "jig_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
tauri-plugin-dialog = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
anyhow = "1"
chrono = "0.4"
pollster = "0.4"
futures = "0.3"

# Pinned to the installed jj CLI so the on-disk repo formats always agree.
jj-lib = "=0.40.0"
jj-cli = "=0.40.0"
bstr = "1"

# Optimise dependencies (jj-lib's diffing especially) even in dev builds.
[profile.dev.package."*"]
opt-level = 2
