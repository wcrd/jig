<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Jig</title>
    <script>
      // Set the theme before first paint; settings.ts keeps it up to date.
      (function () {
        var theme = null;
        try {
          theme = localStorage.getItem("theme");
        } catch (e) {}
        var dark = theme === "dark" || (theme !== "light" && matchMedia("(prefers-color-scheme: dark)").matches);
        document.documentElement.dataset.theme = dark ? "dark" : "light";
      })();
    </script>
    <link rel="stylesheet" href="/src/styles.css" />
    <script type="module" src="/src/main.ts"></script>
  </head>
  <body>
    <nav id="repo-tabs" class="repo-tabs">
      <div id="tab-list" class="tab-list"></div>
      <div id="drop-marker" class="drop-marker" hidden></div>
      <button id="new-tab" class="new-tab" title="Open repository in a new tab (⌘T)">
        <svg viewBox="0 0 16 16" width="12" height="12"><path d="M8 3v10M3 8h10" stroke="currentColor" stroke-width="1.6" stroke-linecap="round"/></svg>
      </button>
    </nav>
    <div id="views" class="views"></div>
    <div id="empty" class="empty" hidden>
      <p>Open a jj repository to see its graph.</p>
      <button id="empty-open">Open Repository…</button>
    </div>
  </body>
</html>
