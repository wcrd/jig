<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Jig</title>
    <script>
      // Set the theme before first paint; settings.ts keeps it up to date.
      (function () {
        var theme = null;
        try {
          theme = localStorage.getItem("theme");
        } catch (e) {}
        var dark = theme === "dark" || (theme !== "light" && matchMedia("(prefers-color-scheme: dark)").matches);
        document.documentElement.dataset.theme = dark ? "dark" : "light";
      })();
    </script>
    <link rel="stylesheet" href="/src/styles.css" />
    <script type="module" src="/src/main.ts"></script>
  </head>
  <body>
    <nav id="repo-tabs" class="repo-tabs">
      <div id="tab-list" class="tab-list"></div>
      <div id="drop-marker" class="drop-marker" hidden></div>
      <button id="new-tab" class="new-tab" title="Open repository in a new tab (⌘T)">
        <svg viewBox="0 0 16 16" width="12" height="12"><path d="M8 3v10M3 8h10" stroke="currentColor" stroke-width="1.6" stroke-linecap="round"/></svg>
      </button>
    </nav>
    <div id="views" class="views"></div>
    <div id="empty" class="empty" hidden>
      <p>Open a jj repository to see its graph.</p>
      <button id="empty-open">Open Repository…</button>
    </div>

    <template id="repo-template">
      <div class="repo-view">
        <header class="toolbar">
          <button data-ref="fetch" class="tool-button" title="Fetch from remotes (jj git fetch)">
            <svg viewBox="0 0 16 16" width="14" height="14"><path d="M8 2.5v8M4.5 7.5L8 11l3.5-3.5M3 13.5h10" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/></svg>
            <span>Fetch</span>
          </button>
          <button data-ref="push" class="tool-button" title="Push bookmarks (jj git push)">
            <svg viewBox="0 0 16 16" width="14" height="14"><path d="M8 13.5v-8M4.5 8.5L8 5l3.5 3.5M3 2.5h10" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/></svg>
            <span>Push</span>
          </button>
          <div class="toolbar-gap"></div>
          <div class="revset">
            <select data-ref="revset-preset" title="Revset presets">
              <option value="">Default</option>
              <option value="all()">All</option>
              <option value="trunk() | bookmarks() | remote_bookmarks() | tags() | @ | ::@ ~ ::trunk()">Bookmarks</option>
              <option value="mine()">Mine</option>
              <option value="custom" hidden>Custom</option>
            </select>
            <input data-ref="revset-input" spellcheck="false" autocapitalize="off" autocorrect="off" autocomplete="off" placeholder="revset" title="Revset (⌘L)" />
          </div>
          <button data-ref="refresh" class="icon-button" title="Reload (⌘R)">
            <svg viewBox="0 0 16 16" width="14" height="14"><path d="M13.5 8a5.5 5.5 0 1 1-1.6-3.9M13.5 2.5v3h-3" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/></svg>
          </button>
          <div class="history-group" title="History">
            <button data-ref="undo" class="icon-button" title="Undo the last jj operation (jj undo)">
              <svg viewBox="0 0 16 16" width="14" height="14"><path d="M5.5 3.5L2.5 6.5l3 3M2.5 6.5h7a4 4 0 0 1 0 8H7" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/></svg>
            </button>
            <button data-ref="redo" class="icon-button" title="Redo (jj redo)">
              <svg viewBox="0 0 16 16" width="14" height="14"><path d="M10.5 3.5l3 3-3 3M13.5 6.5h-7a4 4 0 0 0 0 8H9" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/></svg>
            </button>
            <button data-ref="oplog-button" class="icon-button" title="Operation log">
              <svg viewBox="0 0 16 16" width="14" height="14"><circle cx="8" cy="8" r="5.75" fill="none" stroke="currentColor" stroke-width="1.5"/><path d="M8 4.75V8l2.25 1.5" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/></svg>
            </button>
          </div>
          <button data-ref="help" class="icon-button help-button toolbar-end" title="Keyboard shortcuts (?)">?</button>
          <button data-ref="settings" class="icon-button" title="Settings (⌘,)">
            <svg viewBox="0 0 16 16" width="14" height="14"><path d="M2.5 4.5h6M11.5 4.5h2M2.5 11.5h2M7.5 11.5h6" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round"/><circle cx="10" cy="4.5" r="1.5" fill="none" stroke="currentColor" stroke-width="1.5"/><circle cx="6" cy="11.5" r="1.5" fill="none" stroke="currentColor" stroke-width="1.5"/></svg>
          </button>
          <div data-ref="status" class="toolbar-status"></div>
        </header>
        <div data-ref="error" class="error" hidden></div>
        <div data-ref="modebar" class="modebar" hidden></div>
        <div class="repo-body">
        <aside data-ref="sidebar" class="sidebar"></aside>
        <div data-ref="split-sidebar" class="splitter columns" title="Drag to resize"></div>
        <div class="workspace">
          <main data-ref="list" class="list">
            <div data-ref="scroller" class="scroller">
              <div data-ref="spacer" class="spacer"></div>
            </div>
          </main>
          <div data-ref="split-details" class="splitter rows" title="Drag to resize"></div>
          <section data-ref="details" class="details">
            <nav data-ref="detail-tabs" class="detail-tabs">
              <button data-tab="commit">Commit</button>
              <button data-tab="changes">Changes</button>
              <button data-tab="tree">File Tree</button>
              <button data-ref="full-diff-enter" class="full-diff-enter" title="Show the changes full size (d)">
                <svg viewBox="0 0 16 16" width="13" height="13"><path d="M9.5 2.5h4v4M6.5 13.5h-4v-4M13.5 2.5L9 7M2.5 13.5L7 9" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/></svg>
              </button>
              <button data-ref="full-diff-exit" class="full-diff-exit" title="Back to the graph (d or Esc)">Exit full size <kbd>Esc</kbd></button>
            </nav>
            <div data-ref="details-body" class="details-body">
              <div data-ref="info-pane" class="info-pane">
                <div data-ref="commit-info" class="commit-info"></div>
                <div data-ref="file-header" class="file-header"></div>
                <div data-ref="file-list" class="file-list"></div>
              </div>
              <div data-ref="split-info" class="splitter columns" title="Drag to resize"></div>
              <div data-ref="diff-view" class="diff-view"></div>
            </div>
          </section>
        </div>
        <aside data-ref="oplog" class="oplog" hidden></aside>
        <section data-ref="resolve" class="takeover" hidden></section>
        </div>
      </div>
    </template>
  </body>
</html>
